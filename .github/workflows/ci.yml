name: TgTop checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: node --check web/app.js
      - run: node --check web/personal.js
      - run: node --check web/school.js
      - run: node --check desktop/main.cjs
      - run: node scripts/account-ui-smoke.cjs
      - run: node scripts/cloud-connection-smoke.cjs
      - run: node scripts/calendar-timezone-smoke.cjs
